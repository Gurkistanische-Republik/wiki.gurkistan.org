<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bearbeiten - Gurkistan Wiki</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316697a'/><polygon points='0,32 0,12 20,32' fill='%23ede134'/><path d='M8 10c2-1 5-1 8 0v12c-3-1-6-1-8 0V10z' fill='%23ffffff' opacity='0.9'/><path d='M24 10c-2-1-5-1-8 0v12c3-1 6-1 8 0V10z' fill='%23ffffff' opacity='0.75'/></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <a href="../" class="brand">
            <svg viewBox="0 0 32 32">
                <rect width="32" height="32" rx="6" fill="#16697a"/>
                <polygon points="0,32 0,12 20,32" fill="#ede134"/>
                <path d="M8 10c2-1 5-1 8 0v12c-3-1-6-1-8 0V10z" fill="#ffffff" opacity="0.9"/>
                <path d="M24 10c-2-1-5-1-8 0v12c3-1 6-1 8 0V10z" fill="#ffffff" opacity="0.75"/>
            </svg>
            Gurkistan Wiki
        </a>
        <div class="search-box">
            <input type="text" id="globalSearch" placeholder="Artikel suchen...">
            <button onclick="handleSearch()">Suchen</button>
        </div>
        <div class="header-user-area" id="headerUserArea"></div>
    </header>

    <div class="article-layout">
        <aside class="sidebar-left">
            <a href="#" onclick="promptNewArticle(); return false;" class="action-link">
                <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Neuen Artikel erstellen
            </a>
            <a id="cancelBtn" href="#" class="action-link" style="margin-top: 10px; border: none; color: #666;">
                <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Abbrechen
            </a>
        </aside>

        <main class="main-content">
            <h1>Artikel bearbeiten</h1>
            
            <div style="margin-bottom: 15px;">
                <label class="form-label" for="editorTitleInput">Artikel-Name (Titel)</label>
                <input type="text" id="editorTitleInput" class="form-control" placeholder="Name des Artikels...">
            </div>

            <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <label class="form-label" for="editorContent" style="margin: 0;">Haupt-Wiki-Inhalt (Markdown unterstützt)</label>
                <label class="btn btn-secondary" style="cursor: pointer; font-size: 0.85rem; padding: 5px 12px; margin: 0;">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    Bild in Text einfügen
                    <input type="file" id="inlineImageInput" accept="image/*" style="display: none;">
                </label>
            </div>

            <textarea id="editorContent" style="height: 280px; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 1.05rem; line-height: 1.6;" placeholder="Schreibe den Markdown-Text hier hinein..."></textarea>

            <div style="margin-top: 15px;">
                <label class="form-label">Im Artikel verwendete Bilder (Vorschau)</label>
                <div id="editorImageGallery" class="editor-image-preview-container">
                    <span style="color: #888; font-size: 0.9rem; font-style: italic;">Noch keine Bilder im Text eingefügt.</span>
                </div>
            </div>

            <div class="toolbar">
                <button id="saveBtn" class="btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Änderungen speichern
                </button>
            </div>
        </main>

        <aside class="knowledge-panel">
            <h3>Knowledge Panel</h3>
            
            <div class="kp-section">
                <label for="editorImage">Panel-Bild Upload</label>
                <input type="file" id="editorImage" accept="image/*">
                <img id="imagePreview" class="kp-image" style="display:none; margin-top: 8px;" alt="Vorschau">
            </div>

            <div class="kp-section">
                <label for="editorDefinition">Definition / Kurzinfo</label>
                <textarea id="editorDefinition" placeholder="Kurze Beschreibung..."></textarea>
            </div>

            <div class="kp-section">
                <label for="editorSources">Quellen (URL | Name oder Text)</label>
                <textarea id="editorSources" placeholder="https://archiv.de | Staatsarchiv&#10;Offizielles Dokument"></textarea>
            </div>

            <div class="kp-section">
                <label for="editorLinks">Links (URL | Name)</label>
                <textarea id="editorLinks" placeholder="https://beispiel.de | Offizielle Website"></textarea>
            </div>
        </aside>
    </div>

    <footer class="footer">
        <span><a href="https://www.alexgaming.dev/impressum" target="_blank">Impressum</a></span>
        <span>•</span>
        <span><a href="https://www.alexgaming.dev/datenschutz" target="_blank">Datenschutz</a></span>
    </footer>

    <script type="module">
        import { db, auth, onAuthStateChanged, doc, getDoc, setDoc, collection, addDoc, serverTimestamp, signOut } from "../js/firebase-init.js";

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        if(!articleId) window.location.href = "../";
        document.getElementById('cancelBtn').href = `../article/?id=${articleId}`;

        onAuthStateChanged(auth, (user) => {
            const userArea = document.getElementById('headerUserArea');
            if (!user) {
                alert("Du musst angemeldet sein, um Artikel bearbeiten zu können!");
                window.location.href = `../login/?redirect=${encodeURIComponent(window.location.href)}`;
            } else {
                userArea.innerHTML = `
                    <span>${user.email || 'Eingeloggt'}</span>
                    <a href="../account/" class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;">Profil</a>
                    <button id="logoutBtn" class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;">Abmelden</button>
                `;
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await signOut(auth);
                    window.location.href = "../login/";
                });
            }
        });

        let base64Image = "";

        function updateEditorImageGallery() {
            const content = document.getElementById('editorContent').value;
            const gallery = document.getElementById('editorImageGallery');
            const imgRegex = /!\[([^\]]*)\]\((data:image\/[^)]+)\)/g;
            let matches = [...content.matchAll(imgRegex)];

            gallery.innerHTML = "";
            if (matches.length === 0) {
                gallery.innerHTML = '<span style="color: #888; font-size: 0.9rem; font-style: italic;">Noch keine Bilder im Text eingefügt.</span>';
                return;
            }

            matches.forEach((match, index) => {
                gallery.innerHTML += `
                    <div class="editor-thumb-item" title="${match[1] || `Bild ${index + 1}`}">
                        <img src="${match[2]}" alt="Vorschau">
                    </div>
                `;
            });
        }

        document.getElementById('editorContent').addEventListener('input', updateEditorImageGallery);

        document.getElementById('editorImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    base64Image = event.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = base64Image;
                    preview.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('inlineImageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result;
                    const textarea = document.getElementById('editorContent');
                    const imgMarkdown = `\n![Bild](${base64})\n`;
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    
                    textarea.value = textarea.value.substring(0, start) + imgMarkdown + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + imgMarkdown.length;
                    textarea.focus();
                    updateEditorImageGallery();
                };
                reader.readAsDataURL(file);
            }
        });

        async function loadContent() {
            const snap = await getDoc(doc(db, "pages", articleId));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('editorTitleInput').value = data.title || articleId;
                document.getElementById('editorDefinition').value = data.definition || "";
                document.getElementById('editorContent').value = data.content || "";
                document.getElementById('editorSources').value = data.sources || "";
                document.getElementById('editorLinks').value = data.links || "";
                
                if (data.imageBase64) {
                    base64Image = data.imageBase64;
                    const preview = document.getElementById('imagePreview');
                    preview.src = base64Image;
                    preview.style.display = "block";
                }
                updateEditorImageGallery();
            } else {
                document.getElementById('editorTitleInput').value = articleId.charAt(0).toUpperCase() + articleId.slice(1).replace(/-/g, ' ');
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!auth.currentUser) {
                alert("Du musst eingeloggt sein, um zu speichern!");
                return;
            }
            const content = document.getElementById('editorContent').value.trim();
            const title = document.getElementById('editorTitleInput').value.trim();
            if (!content) return alert("Der Hauptinhalt darf nicht leer sein!");
            if (!title) return alert("Der Titel darf nicht leer sein!");

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = `Speichert...`;

            try {
                const payload = {
                    title: title,
                    definition: document.getElementById('editorDefinition').value.trim(),
                    content: content,
                    sources: document.getElementById('editorSources').value.trim(),
                    links: document.getElementById('editorLinks').value.trim(),
                    imageBase64: base64Image
                };

                await setDoc(doc(db, "pages", articleId), payload, { merge: true });
                await addDoc(collection(db, "pages", articleId, "history"), { content: content, timestamp: serverTimestamp() });

                window.location.href = `../article/?id=${articleId}`;
            } catch(err) {
                alert("Fehler beim Speichern. Prüfe deine Berechtigungen.");
                btn.innerHTML = `Änderungen speichern`;
            }
        });

        window.handleSearch = () => {
            const val = document.getElementById('globalSearch').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
            if (val) window.location.href = `../article/?id=${val}`;
        };

        window.promptNewArticle = () => {
            const name = prompt("Name des neuen Artikels:");
            if (name) {
                const slug = name.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
                window.location.href = `../edit/?id=${slug}`;
            }
        };

        document.getElementById('globalSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        loadContent();
    </script>
</body>
</html>
